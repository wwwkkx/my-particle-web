<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="overlay">
    <h1>Wspace</h1>
    <p>Explore the Universe</p>
    <button id="start-btn" onclick="startApp()">Enter Space</button>
</div>

<div id="status" role="status" aria-live="polite">系统就绪</div>

<!-- Audio Element -->
<audio id="bgm" loop preload="none">
</audio>

<!-- Controls Container -->
<div class="controls-container">
    <!-- Music Controls -->
    <div class="control-item music-control">
        <div class="music-info">
            <span id="music-name">🎵 Loading...</span>
        </div>
        <div class="music-actions">
            <button class="icon-btn" onclick="prevSong()" title="上一首">⏮</button>
            <label class="switch mini">
                <input type="checkbox" id="music-toggle" aria-label="背景音乐" onchange="toggleMusic(this)" checked>
                <span class="slider"></span>
            </label>
            <button class="icon-btn" onclick="nextSong()" title="下一首">⏭</button>
        </div>
    </div>

    <!-- Camera Toggle -->
    <div class="control-item">
        <span>🖐️ 手势</span>
        <label class="switch">
            <input type="checkbox" id="camera-toggle" aria-label="摄像头手势控制" onchange="toggleCamera(this)">
            <span class="slider"></span>
        </label>
    </div>
</div>

<!-- Solar System Button -->
<button id="solar-system-btn" onclick="enterSolarSystem()">🌌 进入太阳系</button>

<nav class="scene-controls" aria-label="场景控制" hidden>
    <button id="prev-theme-btn" class="scene-btn" onclick="cycleNextTheme(-1)" aria-label="上一个主题">‹</button>
    <button id="shape-btn" class="scene-btn" onclick="toggleShape()">✨ 凝聚</button>
    <button id="next-theme-btn" class="scene-btn" onclick="cycleNextTheme(1)" aria-label="下一个主题">›</button>
    <label class="picker-label" for="planet-picker">探索</label>
    <select id="planet-picker" aria-label="选择星球或主题" onchange="if(this.value) explorePlanet(this.value)">
        <option value="">选择星球</option>
        <option value="sun">太阳</option><option value="mercury">水星</option>
        <option value="venus">金星</option><option value="earth">地球</option>
        <option value="mars">火星</option><option value="jupiter">木星</option>
        <option value="saturn">土星</option><option value="uranus">天王星</option>
        <option value="neptune">海王星</option><option value="pluto">冥王星</option>
        <option value="christmas">圣诞树</option><option value="black_hole">卡冈图亚</option>
    </select>
</nav>

<details class="help-control" hidden>
    <summary>操作说明</summary>
    <div class="help-content">
        <p>拖动旋转；在太阳系中用滚轮或双指缩放，点击行星探索。</p>
        <p>点击「凝聚」查看当前主题；点击「返回星云」散开；「太阳系全景」重新定位。</p>
        <p>键盘：← → 切换星云主题，空格凝聚或散开，Esc 返回星云。</p>
        <p>手势需允许摄像头：握拳凝聚、张手散开、OK 切换主题。关闭开关即停止摄像头。</p>
        <p>此为艺术化粒子场景，天体大小与距离不按真实比例。</p>
    </div>
</details>

<div id="video-container">
    <video id="input_video" playsinline muted></video>
</div>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<!-- Main Logic -->
<script src="script.js"></script>

</body>
</html>
